<!DOCTYPE html>
<html lang="de" data-theme="co-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kran-Konfigurator · LR 1300 SX</title>
  <link rel="stylesheet" href="../design-system/lds.css" />
  <script src="konfig-data.js"></script>
  <style>
    /* Prototyp-Styling – ausschließlich über LDS-Tokens. Diese cfg-* Regeln
       entsprechen den vorgeschlagenen neuen Komponenten (Stepper, Option-Card,
       Length-Picker, Summary-Rail) und würden bei Umsetzung nach
       design-system/components/ überführt. */
    body { background: var(--r-bg-dim); }
    .cfg-app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    @media (max-width: 1100px){ .cfg-app{ grid-template-columns: 200px 1fr; } }

    /* ---- Appbar ---- */
    .cfg-bar { grid-column: 1 / -1; }
    .cfg-bar__brand { font: 900 18px/22px var(--font-head-b); }
    .cfg-bar__brand span { color: var(--r-brand); }
    .cfg-bar__machine { margin-left:auto; display:flex; align-items:center; gap: var(--s-3);
      font: 400 13px/16px var(--font-text); color: var(--r-chrome-on, var(--r-on-surface-default)); opacity:.85; }

    /* ---- Stepper ---- */
    .cfg-steps { background: var(--r-bg-bright); border-right: 1px solid var(--r-outline-bright);
      padding: var(--s-5) var(--s-3); display:flex; flex-direction:column; gap: var(--s-1); }
    .cfg-steps__label { font: 700 11px/14px var(--font-text-b); text-transform:uppercase; letter-spacing:.08em;
      color: var(--r-on-surface-muted); padding: 0 var(--s-3) var(--s-3); }
    .cfg-step { display:flex; align-items:center; gap: var(--s-3); padding: var(--s-3);
      border:0; background:transparent; width:100%; text-align:left; cursor:pointer;
      color: var(--r-on-surface-muted); font: 400 14px/18px var(--font-text); border-radius: var(--radius-2);
      transition: background var(--motion-fast) var(--easing); }
    .cfg-step:hover:not(:disabled){ background: var(--r-surface-high); }
    .cfg-step:disabled{ opacity:.4; cursor:not-allowed; }
    .cfg-step.is-active{ background: var(--r-surface-high); color: var(--r-on-surface-default); font-family: var(--font-text-m); }
    .cfg-step__num { flex:0 0 24px; height:24px; display:grid; place-items:center; border-radius:var(--radius-pill);
      border:1px solid var(--r-outline-default); font: 700 12px/1 var(--font-text-b); color: var(--r-on-surface-muted); }
    .cfg-step.is-active .cfg-step__num { background: var(--r-brand); color: var(--r-on-brand); border-color: var(--r-brand); }
    .cfg-step.is-done .cfg-step__num { background: var(--r-success); color: var(--r-on-success); border-color: var(--r-success); }
    .cfg-step__sub { display:block; font-size:11px; opacity:.7; }

    /* ---- Work area ---- */
    .cfg-main { padding: var(--s-6) var(--s-7); max-width: 780px; }
    .cfg-eyebrow { font: 700 12px/16px var(--font-text-b); text-transform:uppercase; letter-spacing:.08em; color: var(--r-accent-3); }
    .cfg-title { font: 900 30px/36px var(--font-head-b); margin: var(--s-2) 0 var(--s-2); letter-spacing:-.01em; }
    .cfg-lead { font: 400 15px/22px var(--font-text); color: var(--r-on-surface-muted); margin-bottom: var(--s-6); max-width: 60ch; }
    .cfg-src { font: 400 12px/16px var(--font-text); color: var(--r-on-surface-muted); }
    .cfg-src b { font-family: var(--font-text-m); color: var(--r-accent-3); }

    /* Option cards (Step 1) */
    .cfg-opts { display:grid; gap: var(--s-4); }
    .cfg-opt { display:grid; grid-template-columns: 1fr; gap: var(--s-4); align-items:center;
      padding: var(--s-4) var(--s-5); background: var(--r-surface-default); cursor:pointer;
      border:1px solid var(--r-outline-bright); box-shadow: var(--shadow-1);
      transition: border-color var(--motion-fast), box-shadow var(--motion-fast); }
    .cfg-opt:hover{ border-color: var(--r-outline-default); box-shadow: var(--shadow-2); }
    .cfg-opt.is-sel{ border-color: var(--r-brand); box-shadow: 0 0 0 2px var(--r-brand); }
    .cfg-opt__name { font: 700 16px/20px var(--font-text-b); }
    .cfg-opt__desc { font: 400 13px/18px var(--font-text); color: var(--r-on-surface-muted); margin-top: 2px; }
    /* Length picker (Step 2/3) */
    .cfg-pick { display:flex; flex-wrap:wrap; gap: var(--s-2); }
    .cfg-chip { min-width:64px; padding: var(--s-3) var(--s-3); text-align:center; cursor:pointer;
      background: var(--r-surface-default); border:1px solid var(--r-outline-bright);
      font: 500 14px/18px var(--font-text-m); transition: all var(--motion-fast); }
    .cfg-chip small { display:block; font:400 10px/12px var(--font-text); color: var(--r-on-surface-muted); }
    .cfg-chip:hover{ border-color: var(--r-outline-default); }
    .cfg-chip.is-sel{ background: var(--r-brand); color: var(--r-on-brand); border-color: var(--r-brand); }
    .cfg-chip.is-sel small { color: var(--r-on-brand); opacity:.75; }

    /* Segment preview */
    .cfg-segbar { display:flex; align-items:stretch; gap:3px; margin: var(--s-4) 0; height:38px; }
    .cfg-seg { display:grid; place-items:center; color: var(--r-on-brand); background: var(--r-accent-3);
      font: 700 11px/1 var(--font-text-b); border-radius: var(--radius-1); min-width: 26px; padding: 0 var(--s-2); }
    .cfg-seg:first-child, .cfg-seg:last-child { background: var(--r-on-surface-default); }

    /* Ballast radial */
    .cfg-ballast { display:grid; grid-template-columns: 1fr 200px; gap: var(--s-6); align-items:center; }
    .cfg-dial { display:grid; place-items:center; }
    .cfg-dial__val { font: 900 26px/1 var(--font-head-b); }
    .cfg-stufen { display:flex; flex-direction:column; gap: var(--s-1); }
    .cfg-stufe { display:flex; align-items:center; gap: var(--s-3); padding: var(--s-2) var(--s-3);
      cursor:pointer; border:1px solid transparent; background: var(--r-surface-default);
      font: 400 13px/18px var(--font-text); }
    .cfg-stufe:hover{ background: var(--r-surface-high); }
    .cfg-stufe.is-sel{ border-color: var(--r-brand); background: var(--r-surface-high); }
    .cfg-stufe__v { font-family: var(--font-text-m); }
    .cfg-stufe__hint { margin-left:auto; font:700 10px/1 var(--font-text-b); color: var(--r-on-warning-soft);
      background: var(--r-warning-soft); padding: 3px 6px; border-radius: var(--radius-1); }

    /* Reeving */
    .cfg-tabs { display:inline-flex; border:1px solid var(--r-outline-default); margin-bottom: var(--s-5); }
    .cfg-tab { padding: var(--s-3) var(--s-5); border:0; background: var(--r-surface-default); cursor:pointer;
      font: 500 13px/18px var(--font-text-m); color: var(--r-on-surface-muted); }
    .cfg-tab.is-sel{ background: var(--r-on-surface-default); color: var(--r-surface-default); }
    .cfg-tab:disabled{ opacity:.4; cursor:not-allowed; }
    .cfg-stepper { display:flex; align-items:center; gap: var(--s-4); margin: var(--s-4) 0; }
    .cfg-stepper button { width:44px; height:44px; font: 700 22px/1 var(--font-text-b);
      border:1px solid var(--r-outline-default); background: var(--r-surface-default); cursor:pointer; }
    .cfg-stepper button:disabled{ opacity:.35; cursor:not-allowed; }
    .cfg-stepper__val { font: 900 32px/1 var(--font-head-b); min-width: 90px; text-align:center; }
    .cfg-stepper__val small { font: 400 13px/1 var(--font-text); color: var(--r-on-surface-muted); }
    .cfg-falls { display:flex; gap:4px; align-items:flex-end; height:44px; }
    .cfg-falls i { width:4px; background: var(--r-accent-3); border-radius: var(--radius-1); }

    /* Summary (Ergebnis-Schritt) */
    .cfg-sum { display:flex; flex-direction:column; }
    .cfg-sum__row { display:flex; justify-content:space-between; gap: var(--s-3); padding: var(--s-3) 0;
      border-bottom:1px solid var(--r-outline-bright); }
    .cfg-sum__k { font: 400 12px/16px var(--font-text); color: var(--r-on-surface-muted); }
    .cfg-sum__v { font: 500 13px/17px var(--font-text-m); text-align:right; }
    .cfg-sum__v em { display:block; font: 400 11px/14px var(--font-text); color: var(--r-accent-3); font-style:normal; }
    .cfg-sum__v.is-empty { color: var(--r-on-surface-disabled); font-style:italic; }

    .cfg-nav { display:flex; gap: var(--s-3); margin-top: var(--s-7); }
    .cfg-footnotes { margin-top: var(--s-4); font: 400 12px/18px var(--font-text); color: var(--r-on-surface-muted); }
    .cfg-footnotes b { font-family: var(--font-text-m); color: var(--r-on-surface-default); }
    .cfg-result__grid { display:grid; grid-template-columns: 1fr 1fr; gap: var(--s-3) var(--s-6); }
  </style>
</head>
<body>
  <div class="cfg-app" id="app"></div>

<script>
const D = window.KONFIG_DATA;
const S = { step: 0, konfig: null, haLen: null, naLen: null,
            ballastIdx: null, lastort: null, einscherHA: 1, einscherNA: 1,
            spur: 'breit', wind: '9', modus: 'HD' };

// welche Schritte sind aktiv (Progressive Disclosure)
function hasNadel(){ const k = D.konfigurationen.find(x=>x.id===S.konfig); return k && k.nadel; }
function nadelTyp(){ const k = D.konfigurationen.find(x=>x.id===S.konfig); return k ? k.nadel : null; }

const STEPS = [
  { key:'konfig', num:'①', label:'Auslegerkonfiguration', sub:()=>S.konfig || '3 Varianten', done:()=>!!S.konfig, show:()=>true },
  { key:'ha',     num:'②', label:'Hauptausleger',        sub:()=>S.haLen?S.haLen+' m':'Tab. 317', done:()=>!!S.haLen, show:()=>true },
  { key:'na',     num:'③', label:'Nadelausleger',        sub:()=>S.naLen?S.naLen+' m':(nadelTyp()==='fest'?'Tab. 326':'Tab. 1916'), done:()=>!hasNadel()||!!S.naLen, show:()=>hasNadel() },
  { key:'ballast',num:'④', label:'Ballast',              sub:()=>S.ballastIdx!=null?ballastLabel(S.ballastIdx):'Tab. 316', done:()=>S.ballastIdx!=null, show:()=>true },
  { key:'einsch', num:'⑤', label:'Einscherung',          sub:()=>S.lastort?einscherVal():'Tab. 353 / 351', done:()=>!!S.lastort, show:()=>true },
  { key:'weiter', num:'⑥', label:'Weiteres',             sub:()=>'Aufstellung, Wind …', done:()=>true, show:()=>true },
  { key:'result', num:'✓', label:'Zusammenstellung',     sub:()=>'Prüfen & übernehmen', done:()=>false, show:()=>true },
];
function visibleSteps(){ return STEPS.filter(s=>s.show()); }
function ballastLabel(i){ const b=D.ballast.stufen[i]; return `${b.heck} t / ${b.zentral} t`; }
function einscherVal(){ return S.lastort==='HA' ? S.einscherHA+'-fach' : S.einscherNA+'-fach'; }

// ---------- Render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = bar() + stepper() + `<div class="cfg-main">${panel()}</div>`;
  bind();
}

function bar(){
  return `<header class="lds-appbar cfg-bar">
    <div class="cfg-bar__brand">Maschinen<span>Assistent</span> · Konfigurator</div>
    <div class="cfg-bar__machine"><span>Aktive Maschine</span>
      <strong>${D.machine.series}</strong><span>Manual ${D.machine.manualVersion}</span></div>
  </header>`;
}

function stepper(){
  const cur = STEPS[S.step].key;
  const items = visibleSteps().map(s=>{
    const active = s.key===cur;
    const done = s.done() && !active;
    const idx = STEPS.indexOf(s);
    const reachable = idx===0 || STEPS.slice(0,idx).every(p=>!p.show()||p.done());
    return `<button class="cfg-step ${active?'is-active':''} ${done?'is-done':''}" data-goto="${idx}" ${reachable?'':'disabled'}>
      <span class="cfg-step__num">${done?'✓':s.num}</span>
      <span>${s.label}<span class="cfg-step__sub">${s.sub()}</span></span>
    </button>`;
  }).join('');
  return `<nav class="cfg-steps"><div class="cfg-steps__label">Konfiguration</div>${items}</nav>`;
}

function panel(){
  switch(STEPS[S.step].key){
    case 'konfig':  return pKonfig();
    case 'ha':      return pLength('ha');
    case 'na':      return pLength('na');
    case 'ballast': return pBallast();
    case 'einsch':  return pEinsch();
    case 'weiter':  return pWeiter();
    case 'result':  return pResult();
  }
}

function head(eye,title,lead,src){
  return `<div class="cfg-eyebrow">${eye}</div><h1 class="cfg-title">${title}</h1>
    <p class="cfg-lead">${lead}</p>${src?`<p class="cfg-src">Quelle im Manual: <b>${src}</b></p>`:''}`;
}

function pKonfig(){
  const opts = D.konfigurationen.map(k=>`
    <div class="cfg-opt ${S.konfig===k.id?'is-sel':''}" data-konfig="${k.id}">
      <div><div class="cfg-opt__name">${k.lang}</div>
        <div class="cfg-opt__desc">${k.nadel?('Nadelausleger '+k.nadel+' · '+k.nadelTabelle):'Ohne Nadelausleger'} · ${k.quelle}</div></div>
    </div>`).join('');
  return head('Schritt ① · Grundaufbau','Auslegerkonfiguration wählen.',
    'Der Grundaufbau bestimmt, welche weiteren Schritte erscheinen. Bei einem Nadelausleger kommen Auswahl des Nadelauslegers und ein zweiter Lastort hinzu.','')
    + `<div class="cfg-opts">${opts}</div>` + nav();
}

function pLength(which){
  const isHA = which==='ha';
  const set = isHA ? D.hauptausleger : D.nadelausleger[nadelTyp()];
  const cur = isHA ? S.haLen : S.naLen;
  const chips = set.laengen.map(l=>`
    <div class="cfg-chip ${cur===l.m?'is-sel':''}" data-len="${l.m}" data-which="${which}">
      ${l.m}<small>m</small></div>`).join('');
  const sel = set.laengen.find(l=>l.m===cur);
  let preview = '';
  if(sel){
    const segs = sel.segmente.map(s=>`<span class="cfg-seg" style="flex:${s}">${s}</span>`).join('');
    preview = `<div class="cfg-src" style="margin-top:var(--s-5)">Zusammenstellung ${sel.m} m
      = ${sel.segmente.join(' + ')} m (${sel.segmente.length} Segmente)</div>
      <div class="cfg-segbar">${segs}</div>`;
  }
  const eye = isHA ? 'Schritt ② · Hauptausleger' : 'Schritt ③ · Nadelausleger';
  const title = isHA ? 'Hauptausleger-Länge.' : `Nadelausleger (${nadelTyp()}).`;
  const lead = isHA
    ? 'Nur die für den Hauptausleger 2320 zulässigen Längen sind wählbar. Die Segment-Zusammenstellung wird direkt aus der Zusammenstellungstabelle abgeleitet.'
    : `Längen laut ${set.tabelle}. Die resultierende Systemlänge ergibt sich aus Haupt- und Nadelausleger.`;
  return head(eye,title,lead, isHA?'Tab. 317 · Zusammenstellung des Hauptauslegers 2320':set.tabelle+' · Zusammenstellung des Nadelauslegers')
    + `<div class="cfg-pick">${chips}</div>${preview}` + nav();
}

function pBallast(){
  const stufen = D.ballast.stufen.map((b,i)=>`
    <div class="cfg-stufe ${S.ballastIdx===i?'is-sel':''}" data-ballast="${i}">
      <span class="cfg-stufe__v">${b.heck} t</span>
      <span class="cfg-src">Heck · Zentral ${b.zentral} t → ${b.drehung}</span>
      ${b.hinweis?`<span class="cfg-stufe__hint">${b.hinweis}</span>`:''}
    </div>`).join('');
  const sel = S.ballastIdx!=null ? D.ballast.stufen[S.ballastIdx] : null;
  const dial = `<svg viewBox="0 0 120 120" width="180" height="180">
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--r-outline-bright)" stroke-width="10"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--r-success)" stroke-width="10"
        stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>
      <text x="60" y="58" text-anchor="middle" class="cfg-dial__val" fill="var(--r-on-surface-default)">${sel?sel.drehung:'–'}</text>
      <text x="60" y="76" text-anchor="middle" font-size="9" fill="var(--r-on-surface-muted)">Schwenkbereich</text>
    </svg>`;
  const notes = sel && sel.hinweis ? sel.hinweis.split(',').map(h=>`<div><b>${h}</b>  ${D.ballast.hinweise[h]}</div>`).join('') : '';
  return head('Schritt ④ · Ballastierung','Ballast & zulässige Drehung.',
    'Die Ballastierung bestimmt laut Tab. 316 die zulässige Drehung des Oberwagens. Voraussetzung: '+D.ballast.voraussetzung+'.',
    'Tab. 316 · Zulässige Drehung des Oberwagens in Abhängigkeit der Ballastierung')
    + `<div class="cfg-ballast"><div class="cfg-stufen">${stufen}</div>
       <div class="cfg-dial">${dial}</div></div>`
    + (notes?`<div class="lds-alert lds-alert--warning" style="margin-top:var(--s-5)"><div>
        <div class="lds-alert__title">Hinweise zur gewählten Ballastierung</div>
        <div class="cfg-footnotes">${notes}</div></div></div>`:'')
    + nav();
}

function pEinsch(){
  const naOK = hasNadel();
  const e = S.lastort==='HA' ? D.einscherung.HA : D.einscherung.NA;
  const val = S.lastort==='HA' ? S.einscherHA : (S.lastort==='NA'? S.einscherNA : null);
  const falls = val ? Array.from({length:val}).map((_,i)=>`<i style="height:${20+ (i%2)*20}px"></i>`).join('') : '';
  const stepperUI = S.lastort ? `
    <div class="cfg-stepper">
      <button data-einsch="-1" ${val<=e.min?'disabled':''}>−</button>
      <div class="cfg-stepper__val">${val}×<br><small>${e.min}–${e.max}-fach zulässig</small></div>
      <button data-einsch="1" ${val>=e.max?'disabled':''}>+</button>
      <div class="cfg-falls">${falls}</div>
    </div>
    <p class="cfg-src">${e.kopf} · ${e.lastort} · zulässige Anzahl laut Traglasttabelle · Quelle <b>${e.tabelle}</b></p>` : '';
  return head('Schritt ⑤ · Einscherung','Lastort & Einscherung.',
    'Zuerst den Lastort wählen, dann die Anzahl der Einscherungen. Die zulässige Maximalzahl ergibt sich aus dem Auslegerkopf.','')
    + `<div class="cfg-tabs">
        <button class="cfg-tab ${S.lastort==='HA'?'is-sel':''}" data-lastort="HA">Hauptausleger-Kopf 2320<br><small>Lastort 2 · 1–20-fach · Tab. 353</small></button>
        <button class="cfg-tab ${S.lastort==='NA'?'is-sel':''}" data-lastort="NA" ${naOK?'':'disabled'}>Nadelausleger-Kopf 1916<br><small>1–6-fach · Tab. 351</small></button>
       </div>${stepperUI}` + nav();
}

function pWeiter(){
  const sel=(name,val,opts)=>`<div class="lds-field"><label class="lds-label">${name}</label>
    <select class="lds-input" data-set="${val}">${opts.map(o=>`<option value="${o.v}" ${S[val]===o.v?'selected':''}>${o.l}</option>`).join('')}</select></div>`;
  return head('Schritt ⑥ · Weiteres','Aufstellung & Rahmenbedingungen.',
    'Ergänzende Einstellungen, die Standsicherheit und gültige Traglasttabelle beeinflussen. In der Demo als Auswahl abgebildet.','')
    + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s-5);max-width:560px">
        ${sel('Raupen-Spurweite','spur',[{v:'breit',l:'Breite Spur'},{v:'schmal',l:'Schmale Spur'}])}
        ${sel('Betriebsmodus / Traglasttabelle','modus',[{v:'HD',l:'HD – Heavy Duty'},{v:'STD',l:'Standard'}])}
        ${sel('Max. Windgeschwindigkeit','wind',[{v:'9',l:'9 m/s'},{v:'14',l:'14 m/s'},{v:'20',l:'20 m/s'}])}
       </div>`
    + `<div class="lds-alert lds-alert--info" style="margin-top:var(--s-6)"><div>
        <div class="lds-alert__title">Hinweis</div>
        <div class="lds-alert__text">Schmale Spur schränkt die zulässige Drehung des Oberwagens zusätzlich ein (Tab. 316).</div></div></div>`
    + nav();
}

function pResult(){
  const k = D.konfigurationen.find(x=>x.id===S.konfig);
  const haSel = S.haLen && D.hauptausleger.laengen.find(l=>l.m===S.haLen);
  const naSel = S.naLen && D.nadelausleger[nadelTyp()].laengen.find(l=>l.m===S.naLen);
  const bal = S.ballastIdx!=null ? D.ballast.stufen[S.ballastIdx] : null;
  const system = (S.haLen||0) + (S.naLen||0);
  const row=(k,v,src)=>`<div class="cfg-sum__k">${k}</div><div class="cfg-sum__v">${v}${src?`<em>${src}</em>`:''}</div>`;
  const complete = S.konfig && S.haLen && (!hasNadel()||S.naLen) && S.ballastIdx!=null && S.lastort;
  return head('Zusammenstellung','Konfiguration prüfen.',
    'Alle Entscheidungen sind mit der jeweiligen Manual-Tabelle belegt. Übernehmen erzeugt einen Rüstplan und verbindet zum Assistenten für die Aufrüst-Schritte.','')
    + `<div class="${complete?'lds-alert lds-alert--success':'lds-alert lds-alert--warning'}" style="margin-bottom:var(--s-6)"><div>
        <div class="lds-alert__title">${complete?'Kombination laut Manual zulässig':'Konfiguration unvollständig'}</div>
        <div class="lds-alert__text">${complete?'Alle Pflichtangaben liegen vor und sind belegt.':'Bitte offene Schritte im Stepper vervollständigen.'}</div></div></div>`
    + `<div class="lds-card"><div class="lds-card__body"><div class="cfg-result__grid cfg-sum" style="border:0">
        ${row('Maschine', D.machine.series)}
        ${row('Auslegerkonfiguration', k?k.lang:'–', k?k.quelle:'')}
        ${row('Hauptausleger', haSel?`${haSel.m} m`:'–', haSel?`${haSel.segmente.join(' + ')} m · Tab. 317`:'')}
        ${hasNadel()?row('Nadelausleger', naSel?`${naSel.m} m (${nadelTyp()})`:'–', naSel?D.nadelausleger[nadelTyp()].tabelle:''):''}
        ${row('Systemlänge', system?`${system} m`:'–')}
        ${row('Ballastierung', bal?`Heck ${bal.heck} t · Zentral ${bal.zentral} t`:'–', bal?`Drehung ${bal.drehung} · Tab. 316`:'')}
        ${row('Einscherung', S.lastort?einscherVal():'–', S.lastort?(S.lastort==='HA'?'HA-Kopf 2320 · Tab. 353':'NA-Kopf 1916 · Tab. 351'):'')}
        ${row('Aufstellung', `${S.spur==='breit'?'Breite':'Schmale'} Spur · ${S.modus} · Wind ${S.wind} m/s`)}
       </div></div>
       <div class="lds-card__footer">
        <button class="lds-btn lds-btn--primary">Traglasttabelle öffnen</button>
        <button class="lds-btn lds-btn--ghost">Als Rüstplan speichern</button>
        <button class="lds-btn lds-btn--ghost">Im Assistent fragen: „Aufrüst-Schritte?"</button>
       </div></div>`
    + `<div class="cfg-nav"><button class="lds-btn lds-btn--ghost" data-prev>Zurück</button></div>`;
}

function nav(){
  const first = S.step===0;
  return `<div class="cfg-nav">
    ${first?'':'<button class="lds-btn lds-btn--ghost" data-prev>Zurück</button>'}
    <button class="lds-btn lds-btn--primary" data-next>Weiter</button></div>`;
}

// ---------- Events ----------
function bind(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ if(!b.disabled){ S.step=+b.dataset.goto; render(); }});
  const next=document.querySelector('[data-next]'); if(next) next.onclick=goNext;
  const prev=document.querySelector('[data-prev]'); if(prev) prev.onclick=goPrev;
  document.querySelectorAll('[data-konfig]').forEach(el=>el.onclick=()=>{ S.konfig=el.dataset.konfig; if(!hasNadel())S.naLen=null; render(); });
  document.querySelectorAll('[data-len]').forEach(el=>el.onclick=()=>{ const v=+el.dataset.len;
    if(el.dataset.which==='ha')S.haLen=v; else S.naLen=v; render(); });
  document.querySelectorAll('[data-ballast]').forEach(el=>el.onclick=()=>{ S.ballastIdx=+el.dataset.ballast; render(); });
  document.querySelectorAll('[data-lastort]').forEach(el=>el.onclick=()=>{ if(!el.disabled){ S.lastort=el.dataset.lastort; render(); }});
  document.querySelectorAll('[data-einsch]').forEach(el=>el.onclick=()=>{ const d=+el.dataset.einsch;
    if(S.lastort==='HA')S.einscherHA=Math.max(D.einscherung.HA.min,Math.min(D.einscherung.HA.max,S.einscherHA+d));
    else S.einscherNA=Math.max(D.einscherung.NA.min,Math.min(D.einscherung.NA.max,S.einscherNA+d)); render(); });
  document.querySelectorAll('[data-set]').forEach(el=>el.onchange=()=>{ S[el.dataset.set]=el.value; render(); });
}
function goNext(){ let i=S.step+1; while(i<STEPS.length && !STEPS[i].show()) i++; S.step=Math.min(i,STEPS.length-1); render(); }
function goPrev(){ let i=S.step-1; while(i>0 && !STEPS[i].show()) i--; S.step=Math.max(i,0); render(); }

render();
</script>
</body>
</html>
